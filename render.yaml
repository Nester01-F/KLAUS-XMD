services:
  - type: worker
    name: klaus-xmd
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: OWNER_NUMBER
        sync: false
      - key: PREFIX
        value: "."
      - key: SESSION_ID
        sync: false
      - key: NODE_VERSION
        value: "20.10.0"